name: v3a_llm_rewrite
description: "Llama 3-templated sec-i1 rewrite plus ATTACK-BERT retrieval on name and description."
input:
  mode: benchmark
  benchmark: cve2attack_result
query:
  strategy: rewrite_cache
  # Template v1 is a new experimental condition; never mix it with the legacy raw-prompt cache.
  cache: data/derived/rewrite_cache/{benchmark}_sec_i1_llama3_chat_v1.json
  llm:
    base_url: http://172.23.216.73:11434/api/generate
    model: sec-i1-cve-rewrite:v1
    # Includes enough headroom for a cold Ollama runner load; warm calls normally finish in seconds.
    timeout_seconds: 300
    max_retries: 3
technique_document:
  include_procedures: false
retrieval:
  model: basel/ATTACK-BERT
  top_k: 20
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
