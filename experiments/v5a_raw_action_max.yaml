name: v5a_raw_action_max
description: Raw CVE description against individual ATT&CK actions, aggregated by maximum similarity.
input:
  mode: benchmark
  benchmark: cve2attack_result
query:
  strategy: raw_description
action_document:
  include_descriptions: true
  include_procedures: true
  min_chars: 20
  max_chars: 1200
  # Strict leave-one-CVE-out: do not let an ATT&CK procedure that names the
  # query CVE act as evidence for that same query.
  exclude_query_cve_actions: true
retrieval:
  model: basel/ATTACK-BERT
  corpus: action
  aggregation: max
  top_k: 20
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
