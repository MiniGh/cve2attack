name: v5c_raw_action_rank_rrf_attack15_1
description: Strict LOO action retrieval on frozen ATT&CK 15.1 for cross-benchmark validation.
input:
  mode: benchmark
  benchmark: cve2attack_result
query:
  strategy: raw_description
technique_document:
  # Pipeline corpus resolution reads the explicit bundle from this shared section.
  attack_bundle: data/knowledge/enterprise-attack-15.1.json
action_document:
  include_descriptions: true
  include_procedures: true
  min_chars: 20
  max_chars: 1200
  exclude_query_cve_actions: true
retrieval:
  model: basel/ATTACK-BERT
  corpus: action
  aggregation: rank_rrf
  aggregation_top_m: 3
  rank_constant: 60
  top_k: 20
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
