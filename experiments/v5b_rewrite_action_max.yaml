name: v5b_rewrite_action_max
description: sec-i1 attacker-action rewrite against individual ATT&CK actions, aggregated by maximum similarity.
input:
  mode: benchmark
  benchmark: cve2attack_result
query:
  strategy: rewrite_cache
  cache: data/derived/rewrite_cache/{benchmark}_sec_i1_llama3_chat_v1.json
  llm:
    base_url: http://172.23.216.73:11434/api/generate
    model: sec-i1-cve-rewrite:v1
    timeout_seconds: 300
    max_retries: 3
action_document:
  include_descriptions: true
  include_procedures: true
  min_chars: 20
  max_chars: 1200
  # Strict leave-one-CVE-out; see the raw-query V5a configuration.
  exclude_query_cve_actions: true
retrieval:
  model: basel/ATTACK-BERT
  corpus: action
  aggregation: max
  top_k: 20
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
