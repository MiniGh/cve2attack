name: v5c_parent_description_ablation_fullranking
description: Frozen V5c parameters with only parent Technique descriptions.
input:
  mode: benchmark
  benchmark: triage_2025_test_all
query:
  strategy: raw_description
technique_document:
  attack_bundle: data/knowledge/enterprise-attack-15.1.json
action_document:
  include_descriptions: true
  include_procedures: true
  source_types: [technique_description]
  min_chars: 20
  max_chars: 1200
  exclude_query_cve_actions: true
retrieval:
  model: basel/ATTACK-BERT
  corpus: action
  aggregation: rank_rrf
  aggregation_top_m: 3
  rank_constant: 60
  top_k: 202
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
