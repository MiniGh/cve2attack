name: v5c_raw_action_rank_rrf_fullranking
description: Diagnostic full ranking for raw CVE queries with fixed rank-RRF action aggregation.
input:
  mode: benchmark
  benchmark: triage_2025_test_all
query:
  strategy: raw_description
action_document:
  include_descriptions: true
  include_procedures: true
  min_chars: 20
  max_chars: 1200
  exclude_query_cve_actions: false
retrieval:
  model: basel/ATTACK-BERT
  corpus: action
  aggregation: rank_rrf
  aggregation_top_m: 3
  rank_constant: 60
  top_k: 202
  batch_size: 32
fusion:
  strategy: none
evaluation:
  benchmarks: [input]
