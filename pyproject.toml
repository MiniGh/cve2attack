[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cve2attack-stage1"
version = "0.1.0"
description = "CVE to MITRE ATT&CK candidate generation and graph-context mapping"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "networkx>=3.0",
  "sentence-transformers>=2.2",
]

[project.scripts]
cve2attack = "cve2attack.cli:main"
cve2attack-stage1 = "cve2attack.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
